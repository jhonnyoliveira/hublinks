{{/* period_custom: período personalizado. Recebe o periodView (Target, From, To) e a Action. */}}
{{define "period_custom"}}<form class="period-custom" method="get" action="{{.Action}}"{{if .Period.Target}} hx-get="{{.Action}}" hx-target="{{.Period.Target}}" hx-swap="outerHTML" hx-push-url="true"{{end}}>
<div class="field"><label for="p-from">De</label><div class="date-input"><input id="p-from" type="text" name="from" value="{{.Period.FromBR}}" placeholder="dd/mm/aaaa" inputmode="numeric" autocomplete="off" maxlength="10" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" title="Use o formato dd/mm/aaaa" required><button type="button" class="btn btn-sm btn-icon" data-date-picker aria-label="Abrir calendário (De)"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button><input type="date" class="date-native" aria-label="Calendário" tabindex="-1" data-date-native></div></div>
<div class="field"><label for="p-to">Até</label><div class="date-input"><input id="p-to" type="text" name="to" value="{{.Period.ToBR}}" placeholder="dd/mm/aaaa" inputmode="numeric" autocomplete="off" maxlength="10" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" title="Use o formato dd/mm/aaaa" required><button type="button" class="btn btn-sm btn-icon" data-date-picker aria-label="Abrir calendário (Até)"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button><input type="date" class="date-native" aria-label="Calendário" tabindex="-1" data-date-native></div></div>
<button class="btn btn-sm">Aplicar</button></form>{{end}}
