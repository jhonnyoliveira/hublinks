{{/* field: ID, Name, Label, Type, Value, Required, Error, Hint, Pattern, MaxLength, Autofocus */}}
{{define "field"}}<div class="field"><label for="{{.ID}}">{{.Label}}{{if .Required}} <span aria-hidden="true">*</span>{{end}}</label><input id="{{.ID}}" name="{{.Name}}" type="{{if .Type}}{{.Type}}{{else}}text{{end}}"{{if .Value}} value="{{.Value}}"{{end}}{{if .Required}} required{{end}}{{if .Pattern}} pattern="{{.Pattern}}"{{end}}{{if .MaxLength}} maxlength="{{.MaxLength}}"{{end}}{{if .Autofocus}} autofocus{{end}}{{if .Error}} aria-invalid="true"{{end}}{{if or .Error .Hint}} aria-describedby="{{if .Error}}{{.ID}}-error{{end}}{{if and .Error .Hint}} {{end}}{{if .Hint}}{{.ID}}-hint{{end}}"{{end}}>{{if .Hint}}<p id="{{.ID}}-hint" class="hint">{{.Hint}}</p>{{end}}{{if .Error}}<p id="{{.ID}}-error" class="field-error" role="alert">{{.Error}}</p>{{end}}</div>{{end}}
