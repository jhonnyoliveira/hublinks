{{/* Aviso informativo (sem pedido de consentimento). "Entendi" lembra o descarte em localStorage; sem cookie. */}}
{{define "privacy_notice"}}<aside id="privacy-notice" class="privacy-notice" aria-label="Aviso de privacidade"><p>Usamos um identificador anônimo, sem cookies de rastreamento, para estatísticas. <a href="/privacidade">Privacidade</a></p><button type="button" id="privacy-dismiss" class="btn btn-sm">Entendi</button></aside><script>!function(){var n=document.getElementById("privacy-notice"),b=document.getElementById("privacy-dismiss");try{if(localStorage.getItem("hublinks-privacy-notice")==="1")n.hidden=true}catch(e){}b.addEventListener("click",function(){try{localStorage.setItem("hublinks-privacy-notice","1")}catch(e){}n.hidden=true})}()</script>{{end}}
