{{/* table: Caption (leitores de tela), Columns []string, Rows [][]string, EmptyText. As células são texto (escapado). */}}
{{define "table"}}<div class="table-wrap"><table class="table-cards"><caption class="sr-only">{{.Caption}}</caption><thead><tr>{{range .Columns}}<th scope="col">{{.}}</th>{{end}}</tr></thead><tbody>{{range .Rows}}<tr>{{range $i, $c := .}}<td{{if $i}} data-label="{{index $.Columns $i}}"{{end}}>{{$c}}</td>{{end}}</tr>{{else}}<tr><td colspan="{{len .Columns}}" class="empty">{{.EmptyText}}</td></tr>{{end}}</tbody></table></div>{{end}}
