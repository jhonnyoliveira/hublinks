{{define "head"}}<title>{{.Title}}</title><meta name="robots" content="noindex"><meta property="og:title" content="{{.Title}}"><meta property="og:description" content="Disponível em {{.Marketplace}}"><meta property="og:url" content="{{.URL}}"><meta property="og:type" content="website">{{if .ImageURL}}<meta property="og:image" content="{{.ImageURL}}"><meta name="twitter:card" content="summary_large_image">{{else}}<meta name="twitter:card" content="summary">{{end}}{{end}}
{{define "content"}}<main class="card public-card">
{{if .ImageURL}}<img src="{{.ImageURL}}" alt="{{.Title}}" width="600" height="314" loading="lazy" referrerpolicy="no-referrer">{{end}}
<div class="card-pad"><h1>{{.Title}}</h1><p class="muted">Disponível em {{.Marketplace}}</p>
<a class="btn btn-primary btn-block" href="{{.DestinationURL}}" rel="noopener noreferrer nofollow sponsored">Ver oferta</a></div>
</main>{{end}}
