{{define "head"}}<title>Canais | Hub Links</title>{{end}}
{{define "content"}}<h1>Canais</h1>{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}<form method="post"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label for="name">Nome</label><input id="name" name="name" required><label for="segment">Segmento</label><input id="segment" name="segment" required pattern="[a-z0-9][a-z0-9-]{0,19}"><button>Criar canal</button></form><ul>{{range .Items}}<li>{{.Name}} — /{{.Segment}}</li>{{else}}<li>Nenhum canal cadastrado.</li>{{end}}</ul>{{end}}
