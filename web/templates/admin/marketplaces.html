{{define "head"}}<title>Marketplaces | Hub Links</title>{{end}}
{{define "content"}}<h1>Marketplaces</h1>{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}<form method="post"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label for="name">Nome</label><input id="name" name="name" required><label for="shorten_policy">Política</label><select id="shorten_policy" name="shorten_policy"><option value="shorten">Encurtar e rastrear</option><option value="direct">URL direta</option></select><button>Criar marketplace</button></form><ul>{{range .Items}}<li>{{.Name}} — {{.ShortenPolicy}}</li>{{else}}<li>Nenhum marketplace cadastrado.</li>{{end}}</ul>{{end}}
